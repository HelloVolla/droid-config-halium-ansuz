[Unit]
After=mount-android.service userdata.mount

[Service]
# The stock unit restarts vendor.hwcomposer-2-3, ansuz runs composer 3.2
ExecStartPre=
ExecStartPre=/usr/bin/droid/waitforservice init.svc.vendor.hwcomposer-3-2 running
ExecStartPre=/usr/bin/sailfish-device-encryption-community-wizard $LIPSTICK_OPTIONS
ExecStartPre=-/system/bin/stop vendor.hwcomposer-3-2
ExecStartPre=-/system/bin/start vendor.hwcomposer-3-2
