# ofono binder driver configuration for MTK devices

[Settings]
Device=/dev/binder
InterfaceType = aidl
# slot2 is the eSIM. Empty, it never becomes ready and blocks the
# lockscreen. Add it back once ofono-binder treats that as absent.
ExpectSlots = slot1
3GLTEHandover = false
MaxNonDataMode = none

emptyPinQuery = false
useDataProfiles = true
mmsDataProfileId = 1001
# RIL_REQUEST_HANGUP_WAITING_OR_BACKGROUND
rilRequestOnSetUdub = 13
extPlugin = mtk
signalStrengthRange=-113,-51

[slot1]
path = /ril_0
slot = 0

[slot2]
path = /ril_1
slot = 1
